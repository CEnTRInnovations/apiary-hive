services:
  api:
    image: ghcr.io/centrinnovations/apiary-hive-api:latest
    environment:
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      OWNER_ACCESS_TOKEN: ${OWNER_ACCESS_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-mistralai/mistral-small-3.2-24b-instruct}
      OPENROUTER_EMBED_MODEL: ${OPENROUTER_EMBED_MODEL:-mistralai/mistral-embed-2312}
    networks:
      default: {}
      centrinnovations-proxy:
        aliases: [hive-api]
    restart: always

networks:
  default:
    name: apiary_hive_default
  centrinnovations-proxy:
    external: true

# Caddy, managed by /opt/centrinnovations, reaches this service by the unique
# hive-api alias on the shared centrinnovations-proxy network.
