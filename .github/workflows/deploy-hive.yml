name: Deploy Hive

on:
  push:
    branches: [main]
    paths:
      # The frontend deploys directly to Cloudflare Workers. Only wake the
      # droplet for changes that can affect the API or its runtime.
      - 'backend/**'
      - 'infra/docker-compose.prod.yml'
      - '.github/workflows/deploy-hive.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/centrinnovations/apiary-hive-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on droplet
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HIVE_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            root@${{ secrets.HIVE_DEPLOY_HOST }} \
            'cd /opt/centrinnovations/apiary-hive && \
             git fetch origin main && \
             git reset --hard origin/main && \
             docker compose -p apiary-hive --env-file infra/.env.prod \
               -f infra/docker-compose.prod.yml pull && \
             docker compose -p apiary-hive --env-file infra/.env.prod \
               -f infra/docker-compose.prod.yml up -d'
